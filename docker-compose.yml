services:
  db:
    image: postgres:16-alpine
    container_name: fiap-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: senha_super_secreta
      POSTGRES_DB: fiap_demo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - fiap-network

  api:
    build:
      context: .
      dockerfile: Dockerfile.multi
    container_name: fiap-api
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/fiap_demo
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=senha_super_secreta
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      - db
    networks:
      - fiap-network

volumes:
  pgdata:

networks:
  fiap-network:
    driver: bridge